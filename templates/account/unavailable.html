<!DOCTYPE html>
{# Shown while the database cannot be reached. Stands alone on purpose: it
   uses nothing that needs the session or the database. #}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Back in a minute — {{ app_name }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a2e; min-height: 100vh; padding: 20px; color: #e0e0e0;
        }
        .box { max-width: 460px; margin: 60px auto 0; text-align: center; }
        h1 { color: #fff; font-size: 30px; margin-bottom: 8px; }
        .sub { color: #8888aa; font-size: 15px; margin-bottom: 26px; }
        .card { background: #16213e; border: 1px solid #2a2a4a; border-radius: 12px; padding: 26px; text-align: left; }
        .card p { font-size: 14px; color: #b0b0cc; line-height: 1.55; margin-bottom: 18px; }
        a.btn {
            padding: 13px 22px; background: linear-gradient(135deg, #5a8dee, #7c5ce7); color: #fff;
            border-radius: 8px; font-size: 15px; font-weight: 600; text-decoration: none; display: inline-block;
        }
    </style>
</head>
<body>
<div class="box">
    <h1>Back in a minute</h1>
    <p class="sub">{{ app_name }} — Core Credits Checker</p>
    <div class="card">
        <p>{{ message }}</p>
        <a class="btn" href="{{ again }}">Try again</a>
    </div>
</div>
</body>
</html>
